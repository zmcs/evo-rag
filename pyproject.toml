[project]
name = "evo-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.33.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
evo-rag = "evo_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
